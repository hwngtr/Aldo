[workspace]
resolver = "3"
members = [
    "crates/aldo-core",
    "crates/aldo-testkit",
    "crates/aldo-store",
    "crates/aldo-net",
    "crates/aldo-catalog",
    "crates/aldo-soulseek",
    "crates/aldo-api",
    "crates/aldo",
]

# What a bare `cargo build` or `cargo run` builds: the CLI and the libraries it
# needs. `aldo-api` is left out because it is an optional target, reached with
# `--features api`, and `aldo-testkit` because it is fixtures for tests only.
default-members = [
    "crates/aldo-core",
    "crates/aldo-store",
    "crates/aldo-net",
    "crates/aldo-catalog",
    "crates/aldo-soulseek",
    "crates/aldo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
publish = false

[workspace.dependencies]
aldo-core = { path = "crates/aldo-core" }
aldo-testkit = { path = "crates/aldo-testkit" }
aldo-store = { path = "crates/aldo-store" }
aldo-net = { path = "crates/aldo-net" }
aldo-catalog = { path = "crates/aldo-catalog" }
aldo-soulseek = { path = "crates/aldo-soulseek" }
aldo-api = { path = "crates/aldo-api" }

thiserror = "2"
# `net` is listed because `aldo` binds a TcpListener directly. Without it here the
# build only succeeds because axum happens to enable tokio's net feature, which is
# a dependency on another crate's feature choices.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unreadable_literal = "allow"
doc_markdown = "allow"
cast_precision_loss = "allow"
many_single_char_names = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"