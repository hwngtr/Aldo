[package]
name = "aldo-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aldo-core.workspace = true
aldo-store.workspace = true
aldo-net.workspace = true
aldo-catalog.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
axum = "0.8"
rand = "0.9"

[dev-dependencies]
# Route tests drive the router directly rather than over a socket, so they need
# the service-ext trait, a runtime and JSON decoding. `axum` is already a normal
# dependency and doubles as the stub server the catalog tests call.
tower = "0.5"
aldo-testkit = { path = "../aldo-testkit" }
tokio.workspace = true
serde_json = "1"

[lints]
workspace = true